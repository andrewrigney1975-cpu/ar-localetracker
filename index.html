<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d1217" />
    <!-- Second line of defence behind escapeHtml: no inline or foreign script can run, and data
         goes only to the map, imagery and weather hosts. Capacitor's bridge is a document-start
         script, which CSP doesn't apply to. MapLibre's worker starts from a blob: URL; tiles
         load with fetch (connect-src), 3D imagery as <img>. Keep in step with viewer/index.html. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.opentopomap.org https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://*.tile.opentopomap.org https://api.open-meteo.com https://historical-forecast-api.open-meteo.com https://archive-api.open-meteo.com; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Locale Exercise Tracker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f2672e' d='M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7z'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <main id="view"></main>
      <nav class="tabbar" aria-label="Primary"></nav>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
