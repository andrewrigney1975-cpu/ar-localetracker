# Publish Locale Viewer (viewer/index.html, built to dist-viewer/) to GitHub Pages at
# https://andrewrigney1975-cpu.github.io/ar-localetracker/, the address course links use
# (VIEWER_URL in src/course/courseLink.js). Needs Settings -> Pages -> Source: GitHub Actions.
#
# Actions are pinned to commit SHAs (the release in the comment), because a tag can be moved to
# different code; Dependabot (.github/dependabot.yml) proposes updates to the SHA and comment.
name: Locale Viewer

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'src/**'
      - 'vite.viewer.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/viewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build never pushes, so don't leave the token in the checkout's git config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/course.test.js tests/courseLink.test.js
      - run: npm run viewer:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-viewer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
