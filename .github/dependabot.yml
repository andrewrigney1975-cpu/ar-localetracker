# Dependabot opens a pull request when a dependency has a newer version or a security fix.
# Monthly and grouped, so updates arrive as a few PRs rather than one per package; security
# updates are separate and come as soon as an advisory is published.
version: 2
updates:
  # The app, the Viewer and the build tools (package.json).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Android phone and watch apps (android/*.gradle, android/variables.gradle).
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    # Capacitor 8 builds with AGP 8.x; these wait for the move to AGP 9.
    ignore:
      - dependency-name: com.android.tools.build:gradle
        versions: [">= 9"]
      # AGP 8 uses a Gradle internal API removed in Gradle 9.6.
      - dependency-name: gradle-wrapper
        versions: [">= 9.6"]
      # These need AGP 9.1 and compileSdk 37 (see android/wear/build.gradle, variables.gradle).
      - dependency-name: androidx.wear.compose:*
        versions: [">= 1.7"]
      - dependency-name: androidx.compose*:*
        versions: [">= 1.12"]
      - dependency-name: androidx.core:*
        versions: [">= 1.19"]
      - dependency-name: androidx.lifecycle:*
        versions: [">= 2.11"]

  # The Viewer's GitHub Pages workflow, pinned to commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
